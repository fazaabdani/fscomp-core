name: Core CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fscomp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fscomp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fscomp_ci?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      CORE_INTEGRATION_TOKEN: ci-core-integration-token-32-characters
      N8N_WEBHOOK_SECRET: ci-n8n-webhook-token-32-characters
      BACKUP_EXPORT_TOKEN: ci-backup-export-token-32-characters
      CORE_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
